<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DengZap</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="row-container.css">
    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="chat-info.css">
    <link rel="stylesheet" href="main-content.css">
    <link rel="stylesheet" href="icons.css">
    <link rel="stylesheet" href="group-info.css">

    <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

<div class="container">

    <header>Header</header>

    <div class="row-container">

        <nav class="navbar">

            <div class="message-icon"></div>

            <div
                class="phone-icon"
                id="nav_phone-icon">
            </div>

            <div class="status-icon"></div>

        </nav>

        <!-- ===================== -->
        <!-- SIDEBAR -->
        <!-- ===================== -->

        <aside class="sidebar">

            <div class="sidebar-header">

                <p>Conversas</p>

                <div class="menu-icon"></div>

            </div>

            <div class="sidebar-search">

                <div
                    class="search-icon"
                    id="aside_search-icon">
                </div>

                <input
                    type="text"
                    class="searchbar">

            </div>

            <div
                class="sidebar-messages"
                id="conversationList">

                <!-- users.js coloca as conversas aqui -->

            </div>

        </aside>

        <!-- ===================== -->
        <!-- CHAT -->
        <!-- ===================== -->

        <main class="main-content">

            <div class="chat-header">

                <div class="header-row">

                    <div
                        class="chat-picture"
                        id="chatPicture">
                    </div>

                    <div class="chat-column">

                        <p
                            class="chat-name"
                            id="chatName">

                            Selecione uma conversa

                        </p>

                        <p
                            class="chat-status"
                            id="chatStatus">

                        </p>

                    </div>

                    <div class="chat_search-icon"></div>

                    <div class="chat_menu-icon"></div>

                </div>

            </div>

            <div
                class="chat-content"
                id="chatMessages">

            </div>

            <div class="text-content">

                <div class="plus-icon"></div>

                <div class="text-message">

                    <input

                        id="messageInput"

                        type="text"

                        class="text-input"

                        placeholder="Digite uma mensagem...">

                </div>

                <button

                    id="sendButton"

                    class="mic-icon"

                    type="button">

                </button>

            </div>

        </main>

        <!-- ===================== -->
        <!-- INFO -->
        <!-- ===================== -->

        <div class="chat-info">

            <div class="contact-info">

                <div class="contact-info_image"></div>

                <div class="contact-info_name">

                    Fut na pracinha

                </div>

                <div class="contact-info_number">

                    17 membros

                </div>

            </div>

            <div class="call">

                <div class="call-item-voice">

                    <div class="call_phone-icon"></div>

                </div>

                <div class="call-item-video">

                    <div class="call_video-icon"></div>

                </div>

                <div class="call-item-search">

                    <div class="call_search-icon"></div>

                </div>

            </div>

            <div class="status">

                <p class="status-title">

                    Descrição

                </p>

                <p>

                    Vamos te passar a chibata

                </p>

            </div>

            <div class="sent-media">

                <p>Sent Media</p>

                <div class="media-images">

                    <div class="media-image"></div>
                    <div class="media-image"></div>
                    <div class="media-image"></div>
                    <div class="media-image"></div>
                    <div class="media-image"></div>
                    <div class="media-image"></div>
                    <div class="media-image"></div>
                    <div class="media-image"></div>

                </div>

            </div>

            <div class="options">

                Options

                <div class="option-item">

                    <div class="star-icon"></div>

                    <p>

                        Mensagens Favoritas

                    </p>

                </div>

                <div class="option-item">

                    <div class="bell-icon"></div>

                    <p>

                        Notificações

                    </p>

                </div>

                <div class="option-item">

                    <div class="heart-icon"></div>

                    <p>

                        Favoritar Conversa

                    </p>

                </div>

            </div>

            <div class="group-member">

                <div class="group-member-item">

                    <div class="member-image"></div>

                    <div class="members-column">

                        <p class="member-name">

                            Paulão

                        </p>

                        <p>

                            Vou te passar a chibata

                        </p>

                    </div>

                </div>

            </div>

            <div class="external-options">

                <div class="external-options-item">

                    <div class="block-icon"></div>

                    <p>

                        Bloquear

                    </p>

                </div>

                <div class="external-options-item">

                    <div class="clean-icon"></div>

                    <p>

                        Limpar conversa

                    </p>

                </div>

                <div class="external-options-item">

                    <div class="erase-icon"></div>

                    <p>

                        Apagar contato

                    </p>

                </div>

            </div>

        </div>

    </div>

    <footer>

        Footer

    </footer>

</div>

<script type="module" src="./chat.js"></script>

</body>

</html>
